# Builds tiles, unattended, a few countries a night, and says how it went.
#
#   plan     reads the state from R2 and picks the regions with work left,
#            in the catalogue's order (pipeline/sg/regions.py)
#   build    one job per region: download and verify its OSM extract, index
#            it, build what is missing within the time budget, publishing
#            each tile and its state record as soon as it is done
#   report   merges the jobs' summaries, posts them to the "Pipeline runs"
#            issue mentioning the owner (GitHub emails it), and opens or
#            comments on a pipeline-alert issue when a job stopped as
#            systemic or more than a fifth of the work failed
#   gaps     finds what the pipeline cannot do yet (station networks no
#            importer reads, upstream failures that repeat), keeps each as an
#            issue labelled gap, and gives the oldest open one to the agent,
#            which researches a source and proposes an importer as a pull
#            request — or explains on the issue why it found none
#   triage   the agent again: on a night with an alarm it investigates and
#            may open a pull request; every night it writes a short summary
#            in Italian on the "Pipeline runs" issue — built, failed, gaps,
#            done about it — which GitHub emails too
#
# Credentials: the R2 keys reach plan, build, report and one state-reading
# step, never a step where the agent runs. The agent runs on the Claude
# subscription (CLAUDE_CODE_OAUTH_TOKEN), not per token, and changes the
# repository only through pull requests. Design: pipeline/ARCHITECTURE.md.
name: Pipeline

on:
  schedule:
    - cron: '17 1 * * *'      # nightly, off the hour when GitHub is busiest
  workflow_dispatch:
    inputs:
      scope: { description: 'build scope (pipeline/sg/regions.py)', default: 'europe' }
      max: { description: 'regions in parallel', default: '6' }
      products: { description: 'products', default: 'wind,heat,heat_night' }
      hours: { description: 'build budget per region, hours', default: '4.5' }
      gap_scope: { description: 'countries whose gaps to track (pipeline/sg/gaps.py)', default: 'next' }
      gaps_only: { description: 'skip the build: only scan the gaps and let the agent work on one', type: boolean, default: false }

# One pipeline run at a time: the state is shared, and two runs on the same
# tiles would only race each other.
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  SCOPE: ${{ inputs.scope || 'europe' }}
  MAX: ${{ inputs.max || '6' }}
  PRODUCTS: ${{ inputs.products || 'wind,heat,heat_night' }}
  HOURS: ${{ inputs.hours || '4.5' }}
  GAP_SCOPE: ${{ inputs.gap_scope || 'next' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: solargaze-tiles
      R2_OPS_BUCKET: solargaze-ops
      # Kept empty and out of the token's reach: a write that succeeds there
      # means the token is account-wide, and the run stops.
      R2_CANARY_BUCKET: solargaze-canary
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      # Whether night heat can run, without handing the plan job the credentials.
      EARTHDATA_CONFIGURED: ${{ secrets.EARTHDATA_TOKEN != '' || secrets.EARTHDATA_PASSWORD != '' }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: '3.13', cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - name: The R2 token reaches its two buckets and nothing else
        working-directory: pipeline
        run: python -m sg doctor --scope-only
      - name: Check the run can work at all
        working-directory: pipeline
        run: python -m sg doctor || true
      - name: Framework tests
        working-directory: pipeline
        run: python -m unittest discover -s tests
      - name: Pick the regions
        id: matrix
        working-directory: pipeline
        run: |
          python -m sg sync
          if [ "${{ inputs.gaps_only }}" = "true" ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"; echo "any=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python -m sg matrix --scope "$SCOPE" --max "$MAX" --products "$PRODUCTS"

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: solargaze-tiles
      R2_OPS_BUCKET: solargaze-ops
      # Kept empty and out of the token's reach: a write that succeeds there
      # means the token is account-wide, and the run stops.
      R2_CANARY_BUCKET: solargaze-canary
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      # Night heat (ECOSTRESS). Without them the product is skipped, never failed.
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.support && 'pieces' || 'build' }} ${{ matrix.name }}
    steps:
      - name: No Overpass on runners (border tiles are finished from the neighbours' pieces)
        run: echo "SG_NO_OVERPASS=1" >> "$GITHUB_ENV"
      - name: Make room (the extract and its index want tens of GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift || true
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: '3.13', cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - name: Build ${{ matrix.region }}
        working-directory: pipeline
        run: |
          python -m sg run --region "${{ matrix.region }}" --products "$PRODUCTS" \
            --hours "$HOURS" --min-free-gb 4 --name "gha-${{ github.run_id }}-${{ matrix.name }}" \
            ${{ matrix.support && '--pieces-only' || '' }}
      - name: Keep the log with the run as well
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.name }}
          path: pipeline/cache/logs/
          retention-days: 14
          if-no-files-found: ignore

  report:
    needs: [plan, build]
    if: always() && needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: solargaze-tiles
      R2_OPS_BUCKET: solargaze-ops
      # Kept empty and out of the token's reach: a write that succeeds there
      # means the token is account-wide, and the run stops.
      R2_CANARY_BUCKET: solargaze-canary
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
    permissions:
      contents: read
      issues: write
    outputs:
      alert: ${{ steps.report.outputs.code == '3' }}
      issue: ${{ steps.alarm.outputs.issue }}
      log: ${{ steps.log.outputs.issue }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: '3.13', cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - name: Merge the summaries
        id: report
        working-directory: pipeline
        run: |
          set +e
          python -m sg report "gha-${{ github.run_id }}" --out ../report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat ../report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Fold the night's state into the base (its only writer)
        working-directory: pipeline
        run: python -m sg sync --compact || echo "compaction failed; the deltas stay and are read as they are"
      - name: Post to the run log (GitHub emails the mention)
        id: log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create pipeline-log --color 0E8A16 --description "One comment per pipeline run" 2>/dev/null || true
          n=$(gh issue list --label pipeline-log --state open --json number --jq '.[0].number')
          if [ -z "$n" ]; then
            n=$(gh issue create --title "Pipeline runs" --label pipeline-log \
                  --body "One comment per run of the Pipeline workflow, with its summary. Keep this issue open." | sed 's#.*/##')
          fi
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          { echo "@${{ github.repository_owner }} — [run ${{ github.run_id }}]($url)"; echo; cat report.md; } | gh issue comment "$n" --body-file -
          echo "issue=$n" >> "$GITHUB_OUTPUT"
      - name: Raise the alarm
        id: alarm
        if: steps.report.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create pipeline-alert --color B60205 --description "The pipeline needs a look" 2>/dev/null || true
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          open=$(gh issue list --label pipeline-alert --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            { echo "Again in [run ${{ github.run_id }}]($url):"; echo; cat report.md; } | gh issue comment "$open" --body-file -
            echo "issue=$open" >> "$GITHUB_OUTPUT"
          else
            new=$({ echo "The [nightly pipeline run]($url) needs a look."; echo; cat report.md; } \
              | gh issue create --title "Pipeline: run ${{ github.run_id }} needs a look" --label pipeline-alert --body-file -)
            echo "issue=${new##*/}" >> "$GITHUB_OUTPUT"
          fi

  # The agent and the gaps. The agent runs here rather than on the issues it
  # is given because issues made with the workflow's own token start no other
  # workflow.
  gaps:
    needs: [plan, report]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    outputs:
      pick: ${{ steps.gaps.outputs.pick }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: '3.13', cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - name: Read the state (the only step here with R2 keys)
        working-directory: pipeline
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: solargaze-tiles
          R2_OPS_BUCKET: solargaze-ops
          # Kept empty and out of the token's reach: a write that succeeds there
          # means the token is account-wide, and the run stops.
          R2_CANARY_BUCKET: solargaze-canary
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python -m sg sync
      - name: Find the gaps, keep them as issues, pick one
        id: gaps
        working-directory: pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python -m sg gaps --scope "$GAP_SCOPE" --sync --out ../gaps.json
      - id: prompt
        if: steps.gaps.outputs.pick != ''
        run: |
          { echo 'text<<PROMPT_END'; sed "s/#GAP/#${{ steps.gaps.outputs.pick }}/g" .github/claude/source-gap.md; echo 'PROMPT_END'; } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        if: steps.gaps.outputs.pick != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # Free and read-only: the agent needs it to see what OpenAQ holds
          # for a country and under which licence each provider shares it.
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          # The whole transcript in the job log: a gap the agent gave up on
          # should say why, and the repository is public anyway.
          show_full_output: true
          claude_args: >-
            --max-turns 120
            --allowedTools "Read,Glob,Grep,Edit,Write,WebSearch,WebFetch,Bash(gh issue:*),Bash(gh pr:*),Bash(gh api:*),Bash(git:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(cd:*),Bash(curl:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(cat:*),Bash(wc:*),Bash(find:*),Bash(grep:*),Bash(jq:*),Bash(mkdir:*),Bash(unzip:*),Bash(gunzip:*),Bash(file:*)"

  triage:
    needs: [plan, report, gaps]
    if: always() && needs.plan.outputs.any == 'true' && needs.report.outputs.log != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # the agent reads what was pushed after the run's commit
      - uses: actions/setup-python@v6
        with: { python-version: '3.13', cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - id: prompt
        env:
          ALERT: ${{ needs.report.outputs.alert }}
          ISSUE: ${{ needs.report.outputs.issue }}
          LOG: ${{ needs.report.outputs.log }}
          PICK: ${{ needs.gaps.outputs.pick }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$ALERT" = "true" ] && [ -n "$ISSUE" ]; then
            alert_line="It raised an alarm, issue #$ISSUE: deal with that first, as below."
          else
            alert_line="No alarm: nothing to fix unless the summary shows a cause worth a look."
          fi
          if [ -n "$PICK" ]; then
            gap_line="Tonight another agent worked on gap issue #$PICK: read its last comment and any pull request that references it."
          else
            gap_line="No gap was worked on tonight."
          fi
          {
            echo 'text<<PROMPT_END'
            if [ "$ALERT" = "true" ] && [ -n "$ISSUE" ]; then sed "s/#ISSUE/#$ISSUE/" .github/claude/pipeline-alert.md; echo; fi
            sed -e "s#RUN_URL#$RUN_URL#" -e "s/#LOG/#$LOG/g" -e "s/ LOG / $LOG /" -e "s/@OWNER/@$OWNER/" \
                -e "s/ALERT_LINE/$alert_line/" -e "s/GAP_LINE/$gap_line/" .github/claude/pipeline-digest.md
            echo 'PROMPT_END'
          } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(gh issue:*),Bash(gh pr:*),Bash(gh run view:*),Bash(git:*),Bash(python:*),Bash(cd:*),Bash(grep:*),Bash(tail:*)"

# An agent in the loop, on the Claude subscription rather than per-token API
# billing: claude-code-action authenticated with CLAUDE_CODE_OAUTH_TOKEN
# (made once with `claude setup-token`). Its use counts against the plan's
# usage limits, like any Claude Code session.
#
#   - an issue labelled pipeline-alert by a person → the agent reads the
#     failure digest and the code, and either explains why no change is
#     needed or opens a pull request with a fix and a test reproducing it
#     (the nightly run starts the same agent itself, in pipeline.yml's
#     triage job: an issue opened by a workflow's own token starts no
#     other workflow).
#
# It does not answer @claude mentions: it acts on pipeline alerts only.
#
# It never pushes to main — changes come as pull requests for a human to
# merge — and it has no R2 credentials: it works on the code, the tests and
# what the issue says, so a mistake of its own cannot touch published data.
name: Claude

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  alert:
    if: >
      github.event_name == 'issues' && github.event.label.name == 'pipeline-alert'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: '3.13', cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - id: prompt
        run: |
          { echo 'text<<PROMPT_END'; sed "s/#ISSUE/#${{ github.event.issue.number }}/" .github/claude/pipeline-alert.md; echo 'PROMPT_END'; } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: --max-turns 40

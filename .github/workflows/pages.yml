# Publishes the repository root to GitHub Pages. There is no build step —
# the site is plain ES modules — so this just uploads the files as they are.
#
# Action majors are pinned to the ones that run on the Node 24 runner:
# checkout@v7, configure-pages@v6, upload-pages-artifact@v5 (composite, and
# it pins upload-artifact@v7 inside) and deploy-pages@v5. The previous set
# ran on Node 20, which GitHub now warns about on every run.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
